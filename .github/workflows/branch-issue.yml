name: Create issue for new branch

on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
  workflow_dispatch:

jobs:
  open-issue:
    runs-on: ubuntu-latest
    if: github.event.created == true
    permissions:
      issues: write

    steps:
      - name: Parse branch name
        id: parse
        run: |
          BRANCH="${{ github.ref_name }}"
          TYPE=$(echo "$BRANCH" | cut -d'/' -f1)
          NUMBER=$(echo "$BRANCH" | cut -d'/' -f2)
          echo "branch=$BRANCH"   >> "$GITHUB_OUTPUT"
          echo "type=$TYPE"       >> "$GITHUB_OUTPUT"
          echo "number=$NUMBER"   >> "$GITHUB_OUTPUT"

      - name: Create tracking issue
        env:
          BRANCH_NAME: ${{ steps.parse.outputs.branch }}
          BRANCH_TYPE: ${{ steps.parse.outputs.type }}
          BRANCH_NUMBER: ${{ steps.parse.outputs.number }}
          ACTOR_NAME: ${{ github.actor }}
          EVENT_PATH: ${{ github.event_path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          api_url = os.environ["GITHUB_API_URL"].rstrip("/")
          repo_full = os.environ["GITHUB_REPOSITORY"]
          owner, repo = repo_full.split("/", 1)
          branch = os.environ["BRANCH_NAME"]
          branch_type = os.environ["BRANCH_TYPE"]
          branch_number = int(os.environ["BRANCH_NUMBER"])
          actor = os.environ["ACTOR_NAME"]
          token = os.environ["GITHUB_TOKEN"]

          def request(method, path, data=None):
              url = f"{api_url}{path}"
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              }
              body = None if data is None else json.dumps(data).encode("utf-8")
              req = urllib.request.Request(url, data=body, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req) as resp:
                      payload = resp.read().decode("utf-8")
                      return json.loads(payload) if payload else None
              except urllib.error.HTTPError as exc:
                  payload = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"{method} {path} failed: HTTP {exc.code} {payload}") from exc

          try:
              repo_data = request("GET", f"/repos/{owner}/{repo}")
          except Exception as exc:
              print(f"::warning::{exc}")
              sys.exit(0)

          if not repo_data.get("has_issues", False):
              print("::warning::Issues are disabled for this repository, skipping branch issue creation.")
              sys.exit(0)

          label_color = "0075ca" if branch_type == "feat" else "e4e669"
          label_name = urllib.parse.quote(branch_type, safe="")
          try:
              request("GET", f"/repos/{owner}/{repo}/labels/{label_name}")
          except Exception:
              try:
                  request("POST", f"/repos/{owner}/{repo}/labels", {
                      "name": branch_type,
                      "color": label_color,
                  })
              except Exception as exc:
                  print(f"::warning::Unable to create label '{branch_type}': {exc}")
                  sys.exit(0)

          try:
              issues = request(
                  "GET",
                  f"/repos/{owner}/{repo}/issues?labels={urllib.parse.quote(branch_type, safe='')}&state=all&per_page=100",
              )
          except Exception as exc:
              print(f"::warning::Unable to list branch issues: {exc}")
              sys.exit(0)

          pattern = re.compile(rf"^\[{re.escape(branch_type)}/(\d+)\]")
          max_number = 0
          for issue in issues:
              match = pattern.match(issue.get("title", ""))
              if match:
                  max_number = max(max_number, int(match.group(1)))
          next_correct = max_number + 1

          warning_block = ""
          if branch_number != next_correct:
              warning_block = "\n".join([
                  "> [!WARNING]",
                  f"> Branch `{branch}` uses number **{branch_number}**, but the latest `{branch_type}` branch is **{branch_type}/{max_number}**.",
                  f"> The correct next number should be **{next_correct}**.",
                  f"> Please delete this branch and recreate it as `{branch_type}/{next_correct}`.",
                  "",
              ])

          placeholder = "<!-- Fill in a short description of the goal of this branch -->"
          body = "\n".join([
              warning_block,
              f"## Tracking branch `{branch}`",
              "",
              f"**Branch:** `{branch}`",
              f"**Type:** {'Feature' if branch_type == 'feat' else 'Bug fix'}",
              f"**Created by:** @{actor}",
              "",
              "---",
              "",
              "### What does this branch do?",
              placeholder,
              "",
              "### Notes",
              "<!-- Anything relevant: design decisions, links, test results -->",
              "",
              "---",
              f"*This issue was opened automatically when branch `{branch}` was created.*",
              "*Close it by merging the PR with `Closes #<issue-number>` in the description.*",
          ])

          try:
              created_issue = request("POST", f"/repos/{owner}/{repo}/issues", {
                  "title": f"[{branch}] ",
                  "labels": [branch_type],
                  "body": body,
              })
          except Exception as exc:
              print(f"::warning::Unable to create tracking issue: {exc}")
              sys.exit(0)

          print(f"Issue #{created_issue['number']} created: {created_issue['html_url']}")

          with open(os.environ["EVENT_PATH"], "r", encoding="utf-8") as fh:
              event = json.load(fh)
          commits = event.get("commits") or []
          if not commits:
              sys.exit(0)

          first_message = commits[0].get("message", "").strip()
          if not first_message:
              sys.exit(0)

          updated_body = (created_issue.get("body") or "").replace(placeholder, first_message)
          try:
              request("PATCH", f"/repos/{owner}/{repo}/issues/{created_issue['number']}", {
                  "body": updated_body,
              })
              print(f'Issue description filled from initial push: "{first_message}"')
          except Exception as exc:
              print(f"::warning::Unable to update branch issue #{created_issue['number']}: {exc}")
          PY

  update-issue-description:
    runs-on: ubuntu-latest
    if: github.event.created == false
    permissions:
      issues: write

    steps:
      - name: Parse branch name
        id: parse
        run: |
          BRANCH="${{ github.ref_name }}"
          TYPE=$(echo "$BRANCH" | cut -d'/' -f1)
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "type=$TYPE"     >> "$GITHUB_OUTPUT"

      - name: Fill issue description from first commit message
        env:
          BRANCH_NAME: ${{ steps.parse.outputs.branch }}
          BRANCH_TYPE: ${{ steps.parse.outputs.type }}
          EVENT_PATH: ${{ github.event_path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          api_url = os.environ["GITHUB_API_URL"].rstrip("/")
          repo_full = os.environ["GITHUB_REPOSITORY"]
          owner, repo = repo_full.split("/", 1)
          branch = os.environ["BRANCH_NAME"]
          branch_type = os.environ["BRANCH_TYPE"]
          token = os.environ["GITHUB_TOKEN"]

          def request(method, path):
              url = f"{api_url}{path}"
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              }
              req = urllib.request.Request(url, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req) as resp:
                      payload = resp.read().decode("utf-8")
                      return json.loads(payload) if payload else None
              except urllib.error.HTTPError as exc:
                  payload = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"{method} {path} failed: HTTP {exc.code} {payload}") from exc

          def patch_issue(issue_number, body):
              url = f"{api_url}/repos/{owner}/{repo}/issues/{issue_number}"
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              }
              payload = json.dumps({"body": body}).encode("utf-8")
              req = urllib.request.Request(url, data=payload, headers=headers, method="PATCH")
              try:
                  with urllib.request.urlopen(req) as resp:
                      payload = resp.read().decode("utf-8")
                      return json.loads(payload) if payload else None
              except urllib.error.HTTPError as exc:
                  payload = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"PATCH /repos/{owner}/{repo}/issues/{issue_number} failed: HTTP {exc.code} {payload}") from exc

          with open(os.environ["EVENT_PATH"], "r", encoding="utf-8") as fh:
              event = json.load(fh)
          commits = event.get("commits") or []
          if not commits:
              print("No commits in this push, skipping.")
              sys.exit(0)

          first_message = commits[0].get("message", "").strip()
          if not first_message:
              print("First commit message is empty, skipping.")
              sys.exit(0)

          try:
              repo_data = request("GET", f"/repos/{owner}/{repo}")
          except Exception as exc:
              print(f"::warning::{exc}")
              sys.exit(0)

          if not repo_data.get("has_issues", False):
              print("::warning::Issues are disabled for this repository, skipping description update.")
              sys.exit(0)

          try:
              issues = request(
                  "GET",
                  f"/repos/{owner}/{repo}/issues?labels={urllib.parse.quote(branch_type, safe='')}&state=open&per_page=50",
              )
          except Exception as exc:
              print(f"::warning::Unable to list branch issues: {exc}")
              sys.exit(0)

          branch_issue = next((issue for issue in issues if issue.get("title", "").startswith(f"[{branch}]")), None)
          if branch_issue is None:
              print("No open issue found for this branch, skipping.")
              sys.exit(0)

          placeholder = "<!-- Fill in a short description of the goal of this branch -->"
          body = branch_issue.get("body") or ""
          if placeholder not in body:
              print("Description already filled in, skipping.")
              sys.exit(0)

          try:
              patch_issue(branch_issue["number"], body.replace(placeholder, first_message))
          except Exception as exc:
              print(f"::warning::Unable to update branch issue #{branch_issue['number']}: {exc}")
              sys.exit(0)

          print(f'Issue #{branch_issue["number"]} updated with: "{first_message}"')
          PY
